name: Debian packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y acl debhelper
      - name: Build package
        env:
          RID: ${{ matrix.rid }}
        run: |
          version=(-p:VersionSuffix="preview.g${GITHUB_SHA:0:8}")
          if [[ $GITHUB_EVENT_NAME == release ]]; then
            [[ $GITHUB_REF_NAME =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.-]+))?$ ]]
            version=(-p:VersionPrefix="${BASH_REMATCH[1]}" -p:VersionSuffix="${BASH_REMATCH[3]}")
          fi
          dotnet msbuild build/PublishZip.targets -t:PublishDeb -p:RID="$RID" -p:PackageDir="$RUNNER_TEMP/debian-packages" "${version[@]}"
      - name: Check installation and upgrade
        run: sudo tests/debian-install.sh "$RUNNER_TEMP"/debian-packages/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.rid }}
          path: ${{ runner.temp }}/debian-packages/*.deb
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: packages
      - run: gh release upload "$GITHUB_REF_NAME" packages/*.deb --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
