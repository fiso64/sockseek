name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*', '[0-9]*.[0-9]*.[0-9]*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'release' && !github.event.deleted
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm, linux-arm64, osx-x64, osx-arm64]
        include:
          - rid: linux-x64
            deb: true
          - rid: linux-arm64
            deb: true
    runs-on: ${{ matrix.rid == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - if: matrix.deb
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper
      - name: Build release files
        env:
          RID: ${{ matrix.rid }}
          TARGETS: ${{ matrix.deb && 'PublishPackage;PublishDeb' || 'PublishPackage' }}
        run: |
          version=(-p:VersionSuffix="alpha.${GITHUB_RUN_NUMBER}")
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            [[ $GITHUB_REF_NAME =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.-]+))?$ ]] || { echo "Invalid release tag: $GITHUB_REF_NAME"; exit 1; }
            version=(-p:VersionPrefix="${BASH_REMATCH[1]}" -p:VersionSuffix="${BASH_REMATCH[3]}")
          fi
          dotnet msbuild build/PublishZip.targets -t:"$TARGETS" -p:RID="$RID" -p:PackageDir="$RUNNER_TEMP/packages" "${version[@]}"
      - name: Check Debian installation and upgrade
        if: matrix.deb
        run: sudo tests/debian-install.sh "$RUNNER_TEMP"/packages/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.rid }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          compression-level: 0

  draft:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Attach packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            [[ $draft == true ]] || { echo "Release $GITHUB_REF_NAME has already been published."; exit 1; }
          else
            flags=(--draft --verify-tag --generate-notes)
            if [[ $GITHUB_REF_NAME == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" packages/* --clobber

  image:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ vars.GHCR_IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
          tags: type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
          flavor: latest=false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOCKSEEK_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
