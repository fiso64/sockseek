# Set your Soulseek credentials. Use password-file for a separate password file.
# username = your-soulseek-username
# password = your-soulseek-password

# Run "sockseek auth hash-password" and paste the result here.
# web-password-hash = ...
allow-http-auth = true
server-ip = 127.0.0.1

data-dir = /var/lib/sockseek/data
output-dir = /var/lib/sockseek/downloads
