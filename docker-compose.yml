services:
  sockseek:
    image: ghcr.io/fiso64/sockseek:4
    restart: unless-stopped
    stop_grace_period: 45s
    user: "${SOCKSEEK_USER:-1654:1654}"
    ports:
      - "127.0.0.1:5030:5030"
      - "49998:49998/tcp"
    volumes:
      - ./instance/config:/etc/sockseek:ro
      - ./instance/data:/var/lib/sockseek
      - ./instance/downloads:/downloads
      - ./instance/shares:/shares:ro
